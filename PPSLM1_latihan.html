<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis Pancasila - Soal Latihan</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            background-color: #f4f6f9;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 25px 35px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
        }
        .section-header {
            background-color: #eef2f7;
            padding: 12px 20px;
            border-left: 6px solid #3498db;
            margin-top: 30px;
            margin-bottom: 20px;
            border-radius: 4px;
        }
        .section-header.bagian2 {
            border-left-color: #27ae60;
        }
        .section-header h2 {
            margin: 0;
            font-size: 1.3rem;
            color: #2c3e50;
        }
        .question-card {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background-color: #fafafa;
        }
        .question-text {
            font-weight: bold;
            margin-bottom: 10px;
            white-space: pre-line;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .option {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            border-radius: 5px;
            background-color: #fff;
            border: 1px solid #cbd5e1;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .option:hover {
            background-color: #f1f5f9;
        }
        .option input[type="radio"] {
            margin-right: 12px;
        }
        .option.correct {
            background-color: #d4edda !important;
            border-color: #c3e6cb !important;
            color: #155724 !important;
            font-weight: bold;
        }
        .control-panel {
            margin-top: 25px;
            padding: 15px;
            background-color: #f8fafc;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }
        .score-box {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 12px;
            color: #1e293b;
        }
        .btn-check {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-check:hover {
            background-color: #2980b9;
        }
        .btn-check.bagian2-btn {
            background-color: #27ae60;
        }
        .btn-check.bagian2-btn:hover {
            background-color: #219150;
        }
    </style>
</head>
<body>

    <!-- BAGIAN 1 -->
    <div class="section-header">
        <h2>🟢 BAGIAN 1 — Soal Dasar (Nomor 1–25)</h2>
    </div>
    <div id="quiz-bagian1"></div>

    <div class="control-panel">
        <div id="result-b1" class="score-box">nilai : -</div>
        <button class="btn-check" onclick="checkAnswers(1, 1, 25)">Periksa Jawaban Bagian 1</button>
    </div>

    <!-- BAGIAN 2 -->
    <div class="section-header bagian2">

    <div class="control-panel">

</div>

const prefixes = ["A. ", "B. ", "C. ", "D. "];

function renderQuiz() {
    const containerB1 = document.getElementById('quiz-bagian1');
    const containerB2 = document.getElementById('quiz-bagian2');

    quizData.forEach((item) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `card-${item.id}`;

        let optionsHTML = '';
        item.options.forEach((opt, idx) => {
            optionsHTML += `
                <label class="option" id="opt-${item.id}-${idx}">
                    <input type="radio" name="q${item.id}" value="${idx}">
                    ${prefixes[idx]}${opt}
                </label>
            `;
        });

        card.innerHTML = `
            <div class="question-text">${item.q}</div>
            <div class="options">${optionsHTML}</div>
        `;

        if (item.id <= 25) {
            containerB1.appendChild(card);
        } else {
            containerB2.appendChild(card);
        }
    });
}

function checkAnswers(partNum, startId, endId) {
    let correctCount = 0;
    let wrongCount = 0;
    const total = (endId - startId) + 1;

    for (let id = startId; id <= endId; id++) {
        const item = quizData.find(q => q.id === id);
        const selectedOption = document.querySelector(`input[name="q${id}"]:checked`);

        // Tandai opsi jawaban benar dengan warna hijau
        const correctLabel = document.getElementById(`opt-${id}-${item.answer}`);
        if (correctLabel) {
            correctLabel.classList.add('correct');
        }

        if (selectedOption) {
            const userAns = parseInt(selectedOption.value);
            if (userAns === item.answer) {
                correctCount++;
            } else {
                wrongCount++;
            }
        } else {
            wrongCount++; // Menganggap jawaban kosong sebagai salah
        }
    }

    // Hitung persentase dalam angka bulat tanpa tanda %
    const scorePercentage = Math.round((correctCount / total) * 100);

    const resultElement = document.getElementById(`result-b${partNum}`);
    resultElement.innerHTML = `nilai : Benar ${correctCount}, Salah ${wrongCount} | Nilai ${scorePercentage}`;
}

window.onload = renderQuiz;
</script>

</body>
</html>
